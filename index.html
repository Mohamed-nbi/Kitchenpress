<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>KitchenPress — Cuisines équipées sur mesure à prix compressés</title>
    <meta
      name="description"
      content="KitchenPress conçoit des cuisines équipées sur mesure, de qualité, livrées en caissons montés. Plan 3D gratuit, devis gratuit. Nous compressons les prix, pas la qualité."
    />
    <meta
      name="keywords"
      content="cuisine équipée, cuisiniste, cuisine sur mesure, cuisine pas chère qualité, plan 3D cuisine gratuit, caissons montés, showroom cuisine"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.kitchenpress.example/" />
    <meta name="author" content="KitchenPress" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KitchenPress" />
    <meta property="og:title" content="KitchenPress — Cuisines équipées sur mesure à prix compressés" />
    <meta
      property="og:description"
      content="Des cuisines de qualité, conçues sur mesure, à des prix intelligemment compressés. Plan 3D et devis gratuits, meubles livrés en caissons montés."
    />
    <!-- [REMPLACER /og-image.jpg PAR UNE VRAIE IMAGE OPEN GRAPH 1200x630] -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://www.kitchenpress.example/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KitchenPress — Cuisines équipées sur mesure à prix compressés" />
    <meta
      name="twitter:description"
      content="Nous compressons les prix, pas la qualité. Découvrez nos cuisines sur mesure, plan 3D et devis gratuits."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Données structurées LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HomeAndConstructionBusiness",
        "name": "KitchenPress",
        "description": "Cuisiniste professionnel proposant des cuisines équipées sur mesure, de qualité, à des prix intelligemment compressés. Plan 3D gratuit, devis gratuit, meubles livrés en caissons montés.",
        "slogan": "Nous compressons les prix, pas la qualité.",
        "image": "/og-image.jpg",
        "priceRange": "€€",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[ADRESSE DU SHOWROOM]",
          "addressLocality": "[VILLE]",
          "postalCode": "[CODE POSTAL]",
          "addressCountry": "FR"
        },
        "telephone": "[VOTRE NUMÉRO]",
        "email": "[VOTRE EMAIL]",
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], "opens": "09:00", "closes": "18:00" }
        ],
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
